<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Top Mark -->
  <g transform="translate(36, 12)">
    <!-- Small bottom purple drop shadow/accent -->
    <path d="M58 98C58 95 62 93 68 93C74 93 78 95 78 98C78 103 74 107 68 107C62 107 58 103 58 98Z" fill="#a99af8" opacity="0.8" />
    
    <!-- Left stem: bright lime neon rounded bar -->
    <rect x="28" y="14" width="24" height="84" rx="12" fill="#c8f828" />

    <!-- Main Charcoal Body (forming the lowercase 'b' loop base) -->
    <path d="M40 50C40 45 44 42 49 42H70C87.673 42 102 56.327 102 74C102 91.673 87.673 106 70 106H45C33.954 106 25 97.046 25 86C25 76.5 32 68 40 64V50Z" fill="#18181b" />

    <!-- Purple circular head/face inside the 'b' loop -->
    <circle cx="72" cy="72" r="26" fill="#a99af8" />

    <!-- Inner dark pupil / eye cutout inside the purple circle -->
    <circle cx="58" cy="70" r="11" fill="#18181b" />

    <!-- Playful expressive face markings on the purple circle -->
    <path d="M73 59L80 65" stroke="#18181b" stroke-width="3" stroke-linecap="round" />
    <path d="M74 81L81 75" stroke="#18181b" stroke-width="3" stroke-linecap="round" />
    <circle cx="85" cy="69" r="2" fill="#18181b" />

    <!-- Terminal prompt inside the lower charcoal body: > _ -->
    <path d="M35 76L41 81L35 86" stroke="#c8f828" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M47 88H57" stroke="#c8f828" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Wordmark: bash-b -->
  <text x="100" y="195" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.04em">
    <tspan fill="#18181b">bash</tspan><tspan fill="#c8f828">-b</tspan>
  </text>
</svg>
